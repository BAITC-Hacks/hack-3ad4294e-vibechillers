# Fixed project name so container and volume names (kit-api-1, kit_kitdata) do not
# depend on the checkout folder. Embedder weights are baked into the api image
# (HF_HOME=/opt/hf in apps/api/Dockerfile), not kept in the volume.
name: kit
#
# Both builds use the repo-root context so the root .dockerignore applies
# (.venv, node_modules, .next, data, .env excluded). apps/web is NOT given a
# apps/web context on purpose: without its own .dockerignore a 400 MB local
# node_modules would be tarred into every build, and the Dockerfile copies
# pinned files from apps/web/... paths anyway.
#
# compose reads the host .env automatically; every LLM_* / path variable uses
# ${VAR:-default} so a missing key falls back to the degraded key-less path
# instead of failing compose parse. The container defaults below are absolute
# /app paths (WORKDIR=/app, so relative host values like `data/app.db` happen
# to resolve identically, but the absolute form is the image's own).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60.0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      DB_PATH: ${DB_PATH:-/app/data/app.db}
      DATA_DIR: ${DATA_DIR:-/app/data}
      SEEDS_DIR: ${SEEDS_DIR:-/app/seeds}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - kitdata:/app/data
    healthcheck:
      # python:3.12-slim has no curl — stdlib urllib; any non-2xx/exception
      # raises and the CMD exits non-zero.
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the client bundle at BUILD time (NEXT_PUBLIC_*). The
        # default is the browser-usable URL on the dev machine: the judge
        # opens http://localhost:3000, the browser then reaches the API at
        # the published host port http://localhost:8000.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      # Re-declared at runtime too (cheap insurance for any server-side read;
      # the client bundle value is fixed at build time regardless).
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kitdata:
