[project]
name = "alem-api"
version = "0.1.0"
description = "Agentic backend toolkit"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.12.0",
    "python-multipart==0.0.31",
    "httpx==0.28.1",
    "openai-agents==0.22.3",
    "sentence-transformers==6.1.0",
    "sqlite-vec==0.1.9",
    "pypdfium2==5.13.0",
    "pdfplumber==0.11.9",
    "charset-normalizer==3.4.4",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "pandas==3.0.6",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime==1.4.4",
]
eval = [
    "ranx==0.3.20",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
